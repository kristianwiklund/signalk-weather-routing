<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Routing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: sans-serif; font-size: 14px; }

    #right-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    #conditions-panel {
      height: 210px;
      background: #1e2230;
      border-top: 2px solid #313244;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
    }
    #conditions-handle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 12px;
      background: #2a2f45;
      font-size: 11px;
      color: #6c7086;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }
    #conditions-handle:hover { background: #313244; }
    #conditions-svg { flex: 1; min-height: 0; display: block; cursor: zoom-in; }
    #conditions-panel.conditions-fullscreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 8000;
    }
    #conditions-panel.conditions-fullscreen #conditions-svg { cursor: zoom-out; }

    #sidebar {
      width: 280px;
      min-width: 280px;
      background: #1e2230;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 14px;
    }

    #map { flex: 1; }

    h1 { font-size: 16px; color: #89b4fa; font-weight: 600; }

    .section { background: #2a2f45; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #6c7086; margin-bottom: 2px; }

    label { font-size: 12px; color: #a6adc8; }
    input[type="datetime-local"], input[type="text"] {
      width: 100%; padding: 6px 8px; border-radius: 4px;
      background: #313244; border: 1px solid #45475a; color: #cdd6f4;
      font-size: 13px;
    }
    input:focus { outline: none; border-color: #89b4fa; }

    .coord-row { display: flex; gap: 6px; align-items: center; }
    .coord-row span { font-size: 12px; color: #6c7086; white-space: nowrap; }
    .coord-value { font-size: 13px; font-family: monospace; color: #cdd6f4; }
    .marker-btn {
      padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: none;
      background: #313244; color: #cdd6f4; white-space: nowrap;
    }
    .marker-btn.active { background: #89b4fa; color: #1e1e2e; }

    button#calculate {
      width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; border: none;
      background: #89b4fa; color: #1e1e2e; font-size: 14px; font-weight: 600;
    }
    button#calculate:disabled { background: #45475a; color: #6c7086; cursor: not-allowed; }

    #status-box {
      background: #2a2f45; border-radius: 6px; padding: 10px;
      font-size: 12px; color: #a6adc8; line-height: 1.5; min-height: 48px;
    }
    #status-box.error { color: #f38ba8; }
    #status-box.done  { color: #a6e3a1; }

    #progress-bar-wrap { background: #313244; border-radius: 4px; height: 6px; overflow: hidden; }
    #progress-bar { height: 100%; background: #89b4fa; width: 0; transition: width 0.3s; }

    #grib-info { font-size: 11px; color: #6c7086; line-height: 1.6; }
    #grib-info span { color: #a6adc8; }

    #grib-warning {
      background: #3a2a10; border: 1px solid #f9a825; border-radius: 5px;
      padding: 8px 10px; font-size: 11px; color: #f9a825; display: none;
    }
    #grib-warning ul { margin: 4px 0 6px 14px; color: #e6c07b; }
    #grib-warning-ack {
      width: 100%; padding: 5px; border-radius: 4px; border: none; cursor: pointer;
      background: #f9a825; color: #1e1e2e; font-size: 11px; font-weight: 600;
    }

    .reload-btn {
      width: 100%; padding: 6px; border-radius: 4px; cursor: pointer; border: none;
      background: #313244; color: #a6adc8; font-size: 12px;
    }
    .reload-btn:hover { background: #45475a; }

    select {
      width: 100%; padding: 6px 8px; border-radius: 4px;
      background: #313244; border: 1px solid #45475a; color: #cdd6f4;
      font-size: 13px; cursor: pointer;
    }
    select:focus { outline: none; border-color: #89b4fa; }

    .layer-toggle { display:flex; align-items:center; gap:8px; color:#cdd6f4; cursor:pointer; font-size:14px; }
    .layer-toggle input[type="checkbox"] { accent-color:#89b4fa; cursor:pointer; }

    #safety-margin-building { font-size:11px; color:#6c7086; display:none; }

    #graph-tooltip {
      position: fixed; display: none;
      background: #2a2f45; border: 1px solid #45475a; border-radius: 4px;
      padding: 6px 10px; font-size: 11px; color: #cdd6f4;
      pointer-events: none; z-index: 9999; white-space: nowrap; line-height: 1.6;
    }

    #failure-popup {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 10001; display: none;
      background: #313244; border-radius: 8px; padding: 10px 14px;
      max-width: 480px; align-items: center; gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); font-size: 13px;
    }
    #failure-popup.error   { border-left: 4px solid #f38ba8; color: #f38ba8; }
    #failure-popup.warning { border-left: 4px solid #f9e2af; color: #f9e2af; }
    #failure-popup-close {
      background: none; border: none; cursor: pointer;
      color: inherit; font-size: 16px; line-height: 1; padding: 0 2px; flex-shrink: 0;
    }

    #save-route-btn {
      width: 100%; padding: 8px; border-radius: 6px; cursor: pointer; border: none;
      background: #a6e3a1; color: #1e1e2e; font-size: 13px; font-weight: 600;
      display: none;
    }
    #save-route-btn:hover { background: #94d89e; }

    #save-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 10000;
      align-items: center; justify-content: center;
    }
    #save-modal-overlay.visible { display: flex; }
    #save-modal {
      background: #2a2f45; border: 1px solid #45475a; border-radius: 8px;
      padding: 20px; width: 320px; display: flex; flex-direction: column; gap: 14px;
    }
    #save-modal h2 { font-size: 14px; color: #cdd6f4; font-weight: 600; }
    #save-modal label { font-size: 12px; color: #a6adc8; }
    #save-modal input { width: 100%; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-buttons button {
      padding: 7px 16px; border-radius: 5px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #modal-save-btn  { background: #89b4fa; color: #1e1e2e; }
    #modal-cancel-btn { background: #313244; color: #cdd6f4; }

    #time-scrubber-panel {
      display: none; flex-direction: row; align-items: center; gap: 8px;
      padding: 4px 10px; background: #1e2230; border-top: 1px solid #313244; flex-shrink: 0;
    }
    #time-scrubber-label { font-size: 11px; color: #a6adc8; white-space: nowrap; min-width: 130px; }
    #time-scrubber { flex: 1; accent-color: #89b4fa; cursor: pointer; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>&#9973; Weather Routing</h1>
    <a href="https://github.com/kristianwiklund/signalk-weather-routing" target="_blank" rel="noopener"
       style="display:inline-flex;align-items:center;gap:4px;color:#a6adc8;font-size:11px;text-decoration:none;margin-bottom:8px">
      <svg height="12" viewBox="0 0 16 16" width="12" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub — source &amp; issues
    </a>

    <div class="section">
      <div class="section-title">Chart</div>
      <select id="chart-select"><option>Loading…</option></select>
    </div>

    <div class="section">
      <div class="section-title">Layers</div>
      <label class="layer-toggle">
        <input type="checkbox" id="land-toggle"> Land overlay
      </label>
      <label class="layer-toggle">
        <input type="checkbox" id="wind-overlay-toggle" checked> Wind overlay
      </label>
    </div>

    <div class="section">
      <div class="section-title">Routing Options</div>
      <label class="layer-toggle" id="safety-margin-wrap" style="display:none">
        <input type="checkbox" id="safety-margin-toggle"> Safety margin (0.5 NM)
      </label>
      <div id="safety-margin-building">Building safety margin dataset (<span id="safety-margin-pct">0</span>%)…</div>
      <label class="layer-toggle">
        <input type="checkbox" id="land-avoidance-toggle" checked> Coast avoidance
      </label>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:11px;color:#a6adc8">Motor</span>
          <div style="display:flex;gap:4px;align-items:center">
            <span style="font-size:11px;color:#a6adc8;white-space:nowrap">below</span>
            <input type="number" id="motor-below-kn" min="0" max="20" step="0.5" placeholder="kn" style="background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;padding:3px 6px;font-size:12px;width:60px">
            <span style="font-size:11px;color:#a6adc8;white-space:nowrap">kn, speed</span>
            <input type="number" id="motor-speed-kn" min="0" max="20" step="0.5" placeholder="kn" style="background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;padding:3px 6px;font-size:12px;width:60px">
            <span style="font-size:11px;color:#a6adc8;white-space:nowrap">kn</span>
          </div>
        </div>
        <label class="layer-toggle">
          <input type="checkbox" id="wait-for-wind-toggle"> Wait for wind
        </label>
        <label style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:11px;color:#a6adc8">Max wind (kn, empty = no limit)</span>
          <input type="number" id="max-wind-kn" min="0" max="200" step="1" style="background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;padding:3px 6px;font-size:12px;width:100%">
        </label>
        <label style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:11px;color:#a6adc8">Max wave (m, empty = no limit)</span>
          <input type="number" id="max-wave-m" min="0" max="30" step="0.5" style="background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;padding:3px 6px;font-size:12px;width:100%">
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">GRIB Forecast</div>
      <div id="grib-info">Loading...</div>
      <div id="grib-warning">
        <div id="grib-warning-msg"></div>
        <ul id="grib-warning-list"></ul>
        <button id="grib-warning-ack"></button>
      </div>
      <button class="reload-btn" id="reload-grib">Reload GRIB directory</button>
    </div>

    <div class="section">
      <div class="section-title">Departure</div>
      <div class="coord-row">
        <button class="marker-btn" id="btn-start">Set on map</button>
        <span class="coord-value" id="start-coords">&#8212;</span>
      </div>
      <select id="departure-resource" style="display:none">
        <option value="">— set from resources —</option>
      </select>
    </div>

    <div class="section">
      <div class="section-title">Destination</div>
      <div class="coord-row">
        <button class="marker-btn" id="btn-end">Set on map</button>
        <span class="coord-value" id="end-coords">&#8212;</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Departure Time</div>
      <input type="datetime-local" id="departure-time">
    </div>

    <button id="calculate" disabled>Calculate Route</button>
    <button id="run-test">Run test</button>
    <button id="run-helsinki-test">Helsinki test</button>
    <button id="run-gothenburg-test">Gothenburg test</button>
    <button id="save-route-btn">Save Route…</button>

    <div id="progress-bar-wrap" style="display:none">
      <div id="progress-bar"></div>
    </div>

    <div id="status-box">Ready</div>
  </div>

  <div id="graph-tooltip"></div>

  <div id="save-modal-overlay">
    <div id="save-modal">
      <h2>Save Route</h2>
      <div>
        <label for="route-name-input">Route name</label>
        <input type="text" id="route-name-input">
      </div>
      <div class="modal-buttons">
        <button id="modal-cancel-btn">Cancel</button>
        <button id="modal-save-btn">Save</button>
      </div>
    </div>
  </div>
  <div id="failure-popup">
    <span id="failure-popup-msg"></span>
    <button id="failure-popup-close">×</button>
  </div>

  <div id="right-col">
    <div id="map"></div>
    <div id="time-scrubber-panel">
      <span id="time-scrubber-label"></span>
      <input type="range" id="time-scrubber" min="0" max="0" value="0">
    </div>
    <div id="conditions-panel">
      <div id="conditions-handle">
        <span>Conditions along route</span>
        <span id="conditions-toggle">&#9660;</span>
      </div>
      <svg id="conditions-svg" width="100%" height="100%"></svg>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // SignalK's helmet sets Referrer-Policy: no-referrer on the page, which strips
    // the Referer header from tile requests. The referrerpolicy attribute on <img>
    // elements overrides the document-level policy for that specific request.
    const _origCreateTile = L.TileLayer.prototype.createTile;
    L.TileLayer.prototype.createTile = function(coords, done) {
      const tile = _origCreateTile.call(this, coords, done);
      tile.referrerPolicy = 'strict-origin-when-cross-origin';
      return tile;
    };
  </script>
  <script>
    const API = '/plugins/signalk-weather-routing';

    const map = L.map('map').setView([0, 0], 2);
    map.createPane('windBarbPane').style.zIndex = '350';
    map.createPane('windOverlayPane').style.zIndex = '300';
    map.createPane('landPane').style.zIndex = '250';
    map.createPane('landDilatedPane').style.zIndex = '248';

    let startLatLon = null;
    let endLatLon = null;
    let placing = null;
    let windOverlayLayer = null;
    let allWindPoints = [];
    let windTimes = [];
    let windTimesLoaded = false;
    let routeLayer = null;
    let windBarbLayer = null;
    const ISOCHRONE_COLOURS = ['#000000', '#4477ff', '#8833cc', '#cc3333'];
    let isochroneLayers = [];

    // Frontier points arrive in pruning order, not geographic order. Without bearing-sort,
    // Leaflet draws polyline segments between non-adjacent points, producing a tangled web
    // of crossing lines. splitByAngularGap then breaks the sorted ring at large gaps so
    // a frontier that wraps past north doesn't close a spurious segment across the map.
    function sortByBearing(pts, origin) {
      return pts.slice().sort((a, b) =>
        Math.atan2(a[1] - origin.lon, a[0] - origin.lat) -
        Math.atan2(b[1] - origin.lon, b[0] - origin.lat)
      );
    }

    const ISOCHRONE_GAP_THRESHOLD_DEG = 10;

    function splitByAngularGap(pts, origin, thresholdDeg) {
      if (pts.length < 2) return [pts];
      const bearing = p => Math.atan2(p[1] - origin.lon, p[0] - origin.lat) * 180 / Math.PI;
      const bearings = pts.map(bearing);
      const angularGap = (a, b) => ((b - a + 540) % 360) - 180; // signed gap a→b, range (-180, 180]
      const segments = [];
      let current = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        if (angularGap(bearings[i - 1], bearings[i]) > thresholdDeg) {
          segments.push(current);
          current = [pts[i]];
        } else {
          current.push(pts[i]);
        }
      }
      segments.push(current);
      // Merge last segment into first if the wrap-around gap is within threshold
      if (segments.length > 1 && angularGap(bearings[bearings.length - 1], bearings[0] + 360) <= thresholdDeg) {
        segments[0] = [...segments[segments.length - 1], ...segments[0]];
        segments.pop();
      }
      return segments;
    }
    const C64_PALETTE = [
      '#000000', // Black
      '#ffffff', // White
      '#883932', // Red
      '#67b6bd', // Cyan
      '#8b3f96', // Purple
      '#55a049', // Green
      '#40318d', // Blue
      '#bfce72', // Yellow
    ];

    let legLabelLayer = null;
    let tileLayer = null;
    let gribBoundsLayers = [];  // index-keyed array, entry may be null if file is unchecked
    let gribInfoFiles = [];     // GribFileMeta[], ordered to match C64_PALETTE assignment
    let departureResources = []; // [{ label, lat, lon }] from routes + waypoints
    let landLayerOrig = null;
    let landLayerDilated = null;
    let renderLandOverlayToken = 0;
    let dilatedIndexReady = false;
    let dilatedPollTimer = null;
    let graphMeta = null;
    let graphLayout = null;
    let gribLoaded = false;   // true when at least one GRIB file is indexed
    let gribWarningAcked = false;
    let calcStream = null;

    const startMarker = L.marker([0,0], { icon: greenIcon() }).addTo(map);
    const endMarker   = L.marker([0,0], { icon: redIcon() }).addTo(map);
    startMarker.remove();
    endMarker.remove();

    const btnStart     = document.getElementById('btn-start');
    const btnEnd       = document.getElementById('btn-end');
    const startCoords  = document.getElementById('start-coords');
    const endCoords    = document.getElementById('end-coords');
    const calcBtn      = document.getElementById('calculate');
    const statusBox    = document.getElementById('status-box');
    const progressWrap = document.getElementById('progress-bar-wrap');
    const progressBar  = document.getElementById('progress-bar');
    const gribInfo     = document.getElementById('grib-info');

    btnStart.addEventListener('click', () => activatePlacing('start'));
    btnEnd.addEventListener('click',   () => activatePlacing('end'));

    document.getElementById('reload-grib').addEventListener('click', async () => {
      try {
        const r = await apiFetch(`${API}/reload-grib`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const j = await r.json();
        if (j.error) setStatus('error', j.error);
        else loadGribInfo();
      } catch(e) { setStatus('error', String(e)); }
    });

    map.on('click', (e) => {
      if (!placing) return;
      const { lat, lng } = e.latlng;
      if (placing === 'start') {
        startLatLon = { lat, lon: lng };
        startCoords.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        startMarker.setLatLng([lat, lng]).addTo(map);
        btnStart.classList.remove('active');
      } else {
        endLatLon = { lat, lon: lng };
        endCoords.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        endMarker.setLatLng([lat, lng]).addTo(map);
        btnEnd.classList.remove('active');
      }
      placing = null;
      map.getContainer().style.cursor = '';
      updateCalcButton();
    });

    calcBtn.addEventListener('click', startCalculation);
    document.getElementById('run-test').addEventListener('click', runTest);
    document.getElementById('run-helsinki-test').addEventListener('click', runHelsinkiTest);
    document.getElementById('run-gothenburg-test').addEventListener('click', runGothenburgTest);

    document.getElementById('time-scrubber').addEventListener('input', e => {
      fetchWindPoints(parseInt(e.target.value));
    });

    const now = new Date(Math.ceil(Date.now() / 1800000) * 1800000);
    document.getElementById('departure-time').value = toLocalDateTimeInput(now);

    loadGribInfo();
    loadCharts();
    loadDepartureResources();
    loadConfig();

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, { ...options, credentials: 'include' });
      if (res.status === 401 || res.status === 403) {
        location.href = `/admin/#/login?redirect=${encodeURIComponent(location.href)}`;
      }
      return res;
    }

    async function loadCharts() {
      const charts = [{
        name: 'OpenStreetMap',
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }];

      try {
        const r = await apiFetch('/signalk/v2/api/resources/charts');
        if (r.ok) {
          const data = await r.json();
          for (const [id, chart] of Object.entries(data)) {
            if (chart.serverType !== 'tilelayer') continue;
            if (chart.url?.includes('.mvt')) continue;
            charts.push({
              name: chart.name || id,
              url: chart.url.replace(/\$z/g, '{z}').replace(/\$x/g, '{x}').replace(/\$y/g, '{y}'),
              attribution: chart.name || id,
            });
          }
        }
      } catch(e) { /* fall back to OSM only */ }

      const select = document.getElementById('chart-select');
      select.innerHTML = charts.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
      setChart(charts[0]);
      select.addEventListener('change', () => setChart(charts[parseInt(select.value)]));
    }

    function setChart(chart) {
      if (tileLayer) map.removeLayer(tileLayer);
      tileLayer = L.tileLayer(chart.url, { attribution: chart.attribution, maxZoom: 19 }).addTo(map);
    }

    async function loadDepartureResources() {
      const sel = document.getElementById('departure-resource');
      const entries = [];

      const [routesRes, wpsRes] = await Promise.allSettled([
        apiFetch('/signalk/v2/api/resources/routes'),
        apiFetch('/signalk/v2/api/resources/waypoints'),
      ]);

      if (routesRes.status === 'fulfilled' && routesRes.value.ok) {
        const data = await routesRes.value.json();
        for (const [, r] of Object.entries(data)) {
          const coords = r.feature?.geometry?.coordinates;
          if (!Array.isArray(coords) || coords.length === 0) continue;
          const [lon, lat] = coords[coords.length - 1];  // last waypoint — continue from where route ended
          if (typeof lat !== 'number' || typeof lon !== 'number') continue;
          entries.push({ label: `\u{1F5FA} ${r.name ?? 'Unnamed route'}`, lat, lon });
        }
      }

      if (wpsRes.status === 'fulfilled' && wpsRes.value.ok) {
        const data = await wpsRes.value.json();
        for (const [, wp] of Object.entries(data)) {
          const coords = wp.feature?.geometry?.coordinates;
          if (!Array.isArray(coords) || coords.length < 2) continue;
          const [lon, lat] = coords;
          if (typeof lat !== 'number' || typeof lon !== 'number') continue;
          entries.push({ label: `\u{1F4CD} ${wp.name ?? 'Unnamed waypoint'}`, lat, lon });
        }
      }

      departureResources = entries;
      if (entries.length === 0) { sel.style.display = 'none'; return; }

      sel.innerHTML = '<option value="">— set from resources —</option>' +
        entries.map((e, i) => `<option value="${i}">${e.label}</option>`).join('');
      sel.style.display = '';
    }

    async function loadConfig() {
      const r = await apiFetch(`${API}/config`);
      if (!r.ok) return;
      const cfg = await r.json();
      if (cfg.configuration?.hideTestButtons) {
        for (const id of ['run-test', 'run-helsinki-test', 'run-gothenburg-test'])
          document.getElementById(id).style.display = 'none';
      }
    }

    document.getElementById('departure-resource').addEventListener('change', (e) => {
      const idx = parseInt(e.target.value);
      if (isNaN(idx)) return;
      const { lat, lon } = departureResources[idx];
      startLatLon = { lat, lon };
      startCoords.textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      startMarker.setLatLng([lat, lon]).addTo(map);
      e.target.value = '';  // reset so the same item can be re-selected
      updateCalcButton();
    });

    function clearGribBoundsLayers() {
      for (const l of gribBoundsLayers) { if (l) map.removeLayer(l); }
      gribBoundsLayers = [];
    }

    async function loadGribInfo() {
      try {
        const r = await apiFetch(`${API}/grib-info`);
        const j = await r.json();

        clearGribBoundsLayers();

        if (!j.files || j.files.length === 0) {
          gribLoaded = false;
          gribInfo.innerHTML = j.gribDir
            ? `<span>No GRIB files found in</span><br>${j.gribDir}`
            : '<span>No GRIB directory configured</span>';
          showGribWarning(j.failedFiles ?? []);
          updateCalcButton();
          return;
        }

        gribLoaded = true;

        gribInfoFiles = j.files;

        // Draw one dashed bbox rectangle per file in C64 palette order
        let boundsUnion = null;
        j.files.forEach((f, i) => {
          const color = C64_PALETTE[i % C64_PALETTE.length];
          const layer = L.rectangle([[f.latMin, f.lonMin], [f.latMax, f.lonMax]], {
            color, weight: 2, fill: false, dashArray: '6 4',
          }).addTo(map);
          gribBoundsLayers[i] = layer;
          const b = L.latLngBounds([[f.latMin, f.lonMin], [f.latMax, f.lonMax]]);
          boundsUnion = boundsUnion ? boundsUnion.extend(b) : b;
        });
        if (boundsUnion) map.fitBounds(boundsUnion);

        // Sidebar: one checkbox-label per file
        gribInfo.innerHTML = j.files.map((f, i) => {
          const color = C64_PALETTE[i % C64_PALETTE.length];
          const start = f.timeStart ? f.timeStart.slice(0,16).replace('T',' ') : '?';
          const end   = f.timeEnd   ? f.timeEnd.slice(0,16).replace('T',' ')   : '?';
          return `<label style="display:flex;align-items:center;gap:6px;cursor:pointer">` +
            `<input type="checkbox" class="grib-file-toggle" data-file-index="${i}" checked ` +
            `style="accent-color:${color};cursor:pointer">` +
            `<span style="color:${color};font-size:11px">${f.nTimes} steps: ${start} &rarr; ${end}</span>` +
            `</label>`;
        }).join('');

        // Wire checkbox toggle: show/hide the bounding box rectangle
        gribInfo.querySelectorAll('.grib-file-toggle').forEach(cb => {
          cb.addEventListener('change', () => {
            const i = parseInt(cb.dataset.fileIndex);
            if (cb.checked) {
              if (!gribBoundsLayers[i]) {
                const f = gribInfoFiles[i];
                const color = C64_PALETTE[i % C64_PALETTE.length];
                gribBoundsLayers[i] = L.rectangle(
                  [[f.latMin, f.lonMin], [f.latMax, f.lonMax]],
                  { color, weight: 2, fill: false, dashArray: '6 4' }
                ).addTo(map);
              }
            } else {
              if (gribBoundsLayers[i]) { map.removeLayer(gribBoundsLayers[i]); gribBoundsLayers[i] = null; }
            }
            if (windTimesLoaded) {
              fetchWindPoints(parseInt(document.getElementById('time-scrubber').value));
            }
          });
        });

        showGribWarning(j.failedFiles ?? []);
        updateCalcButton();
        initWindScrubber();
      } catch(e) {
        gribInfo.textContent = 'Could not reach plugin API';
      }
    }

    function showGribWarning(failedFiles) {
      const warn = document.getElementById('grib-warning');
      if (!failedFiles || failedFiles.length === 0) {
        warn.style.display = 'none';
        gribWarningAcked = true;
        updateCalcButton();
        return;
      }
      gribWarningAcked = false;
      const total = gribBoundsLayers.length + failedFiles.length;
      const ok = gribBoundsLayers.length;
      document.getElementById('grib-warning-msg').textContent =
        `${failedFiles.length} of ${total} GRIB file(s) could not be indexed:`;
      const ul = document.getElementById('grib-warning-list');
      ul.innerHTML = failedFiles.map(f =>
        `<li title="${f.error}">${f.path.split('/').pop()}</li>`
      ).join('');
      document.getElementById('grib-warning-ack').textContent =
        `Continue with ${ok} of ${total} file(s)`;
      warn.style.display = 'block';
      updateCalcButton();
    }

    document.getElementById('grib-warning-ack').addEventListener('click', () => {
      gribWarningAcked = true;
      document.getElementById('grib-warning').style.display = 'none';
      updateCalcButton();
    });

    async function startCalculation() {
      if (!startLatLon || !endLatLon) return;
      const depTime = document.getElementById('departure-time').value;
      if (!depTime) return setStatus('error', 'Please set a departure time');

      clearIsochrones();
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      if (windBarbLayer) { map.removeLayer(windBarbLayer); windBarbLayer = null; }
      if (legLabelLayer) { map.removeLayer(legLabelLayer); legLabelLayer = null; }
      if (windTimesLoaded) {
        const scrubber = document.getElementById('time-scrubber');
        scrubber.min = 0;
        scrubber.max = windTimes.length - 1;
      }
      if (calcStream) { calcStream.close(); calcStream = null; }
      document.getElementById('save-route-btn').style.display = 'none';
      document.getElementById('conditions-panel').style.display = 'none';
      hideFailurePopup();
      calcBtn.disabled = true;
      progressWrap.style.display = 'block';
      progressBar.style.width = '0';
      setStatus('', 'Connecting…');
      console.log(`[startCalculation] t=${Date.now()}`);

      // Open SSE stream and wait for onopen before sending the POST.
      // This guarantees the server has registered the client in sseClients
      // before the calculation starts, so no onProgress events are missed.
      try {
        await openCalcStream();
      } catch(e) {
        setStatus('error', `Could not open event stream: ${e.message}`);
        calcBtn.disabled = false;
        return;
      }

      setStatus('', 'Sending request…');

      try {
        const r = await apiFetch(`${API}/calculate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            start: startLatLon,
            end: endLatLon,
            departureTime: new Date(depTime).toISOString(),
            useSafetyMargin: document.getElementById('safety-margin-toggle').checked,
            useLandAvoidance: document.getElementById('land-avoidance-toggle').checked,
            enabledGribPaths: gribInfoFiles
              .filter((_, i) => {
                const cb = gribInfo.querySelector(`[data-file-index="${i}"]`);
                return !cb || cb.checked;
              })
              .map(f => f.path),
            options: {
              motorBelowKn: parseFloat(document.getElementById('motor-below-kn').value) || undefined,
              motorSpeedKn: parseFloat(document.getElementById('motor-speed-kn').value) || undefined,
              waitForWind:  document.getElementById('wait-for-wind-toggle').checked || undefined,
              maxWindKn:    parseFloat(document.getElementById('max-wind-kn').value)    || undefined,
              maxWaveM:     parseFloat(document.getElementById('max-wave-m').value)     || undefined,
            },
          }),
        });
        const j = await r.json();
        if (j.error) {
          if (calcStream) { calcStream.close(); calcStream = null; }
          setStatus('error', j.error);
          calcBtn.disabled = false;
          return;
        }
      } catch(e) {
        if (calcStream) { calcStream.close(); calcStream = null; }
        setStatus('error', String(e));
        calcBtn.disabled = false;
        return;
      }

      if (!calcStream) return; // SSE error/done already handled the result
      setStatus('', 'Calculating…');
    }

    function openCalcStream() {
      return new Promise((resolve, reject) => {
        console.log(`[openCalcStream] EventSource created t=${Date.now()}`);
        const stream = new EventSource(`${API}/calculation-stream`);
        const hangTimer = setTimeout(() => {
          console.log(`[openCalcStream] HANG: onopen has not fired after 5s, readyState=${stream.readyState}`);
        }, 5000);

        stream.onopen = () => {
          clearTimeout(hangTimer);
          console.log(`[openCalcStream] onopen fired t=${Date.now()}`);
          calcStream = stream;
          resolve();
        };

        stream.onmessage = (e) => {
          const j = JSON.parse(e.data);

          if (j.type === 'progress') {
            progressBar.style.width = `${j.progress}%`;
            setStatus('', `Calculating… ${j.progress}%`);
            if (j.frontier?.length) {
              const pts = sortByBearing(j.frontier.map(([lat, lon]) => [lat, lon]), startLatLon);
              const colour = ISOCHRONE_COLOURS[isochroneLayers.length % ISOCHRONE_COLOURS.length];
              const segments = splitByAngularGap(pts, startLatLon, ISOCHRONE_GAP_THRESHOLD_DEG);
              for (const seg of segments) {
                isochroneLayers.push(
                  L.polyline(seg, { color: colour, weight: 1.0, opacity: 0.6, interactive: false }).addTo(map)
                );
              }
            }
          } else if (j.type === 'done') {
            stream.close(); calcStream = null;
            progressBar.style.width = '100%';
            setStatus('done', 'Route calculated.');
            calcBtn.disabled = false;
            document.getElementById('save-route-btn').style.display = 'block';
            fetchAndDrawRoute();
          } else if (j.type === 'warning') {
            stream.close(); calcStream = null;
            progressBar.style.width = '100%';
            setStatus('done', `Partial route: ${j.warning}`);
            showFailurePopup(j.warning, true);
            calcBtn.disabled = false;
            document.getElementById('save-route-btn').style.display = 'block';
            fetchAndDrawRoute();
          } else if (j.type === 'error') {
            stream.close(); calcStream = null;
            const reasonText = {
              land: 'All available paths are blocked by land.',
              wind: 'Wind is too light or adverse to make progress under sail.',
              grib_exhausted: 'Destination not reached before the forecast period ends.',
            }[j.reason] ?? '';
            const errMsg = (j.error ?? 'Unknown error') + (reasonText ? ` — ${reasonText}` : '');
            setStatus('error', errMsg);
            showFailurePopup(errMsg, false);
            calcBtn.disabled = false;
            progressWrap.style.display = 'none';
          }
        };

        stream.onerror = () => {
          console.log(`[openCalcStream] onerror fired t=${Date.now()} calcStream=${calcStream !== null}`);
          stream.close();
          if (!calcStream) {
            // onopen never fired — connection failed
            reject(new Error('stream connection failed'));
          } else {
            calcStream = null;
            setStatus('error', 'Lost connection to calculation stream');
            calcBtn.disabled = false;
            progressWrap.style.display = 'none';
          }
        };
      });
    }

    function clearIsochrones() {
      isochroneLayers.forEach(l => map.removeLayer(l));
      isochroneLayers = [];
    }

    function windBarbSvg(tws, windDir, color = '#333') {
      let remaining = Math.round(tws);
      const pennants = Math.floor(remaining / 50); remaining %= 50;
      const fulls    = Math.floor(remaining / 10); remaining %= 10;
      const halfs    = Math.floor(remaining / 5);

      // Staff points up; barbs drawn from tip downward; circle at base (observation point).
      let y = 2;
      let barbs = '';
      for (let i = 0; i < pennants; i++) {
        barbs += `<polygon points="0,${y} 8,${y + 4} 0,${y + 8}" fill="${color}"/>`;
        y += 10;
      }
      for (let i = 0; i < fulls; i++) {
        barbs += `<line x1="0" y1="${y}" x2="8" y2="${y + 4}" stroke="${color}" stroke-width="1.5"/>`;
        y += 5;
      }
      if (halfs) {
        barbs += `<line x1="0" y1="${y}" x2="4" y2="${y + 2}" stroke="${color}" stroke-width="1.5"/>`;
      }
      const staff = `<line x1="0" y1="2" x2="0" y2="22" stroke="${color}" stroke-width="1.5"/>`;

      return `<div style="transform:rotate(${windDir}deg);transform-origin:15px 33px;width:30px;height:36px;overflow:visible">` +
        `<svg width="30" height="36" viewBox="-6 0 18 36" style="overflow:visible">` +
        `${staff}${barbs}` +
        `<circle cx="0" cy="22" r="3" fill="none" stroke="${color}" stroke-width="1.5"/>` +
        `</svg></div>`;
    }

    async function fetchWindPoints(timeIdx) {
      const params = new URLSearchParams({ timeIdx });
      gribInfoFiles.forEach((f, i) => {
        const cb = gribInfo.querySelector(`[data-file-index="${i}"]`);
        if (!cb || cb.checked) params.append('path', f.path);
      });
      const r = await apiFetch(`${API}/wind-grid?${params}`);
      if (!r.ok) return;
      const { points } = await r.json();
      allWindPoints = points;

      const label = new Date(windTimes[timeIdx]).toLocaleString([], {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
      document.getElementById('time-scrubber-label').textContent = label;

      if (document.getElementById('wind-overlay-toggle').checked) renderWindOverlay();
    }

    function renderWindOverlay() {
      if (windOverlayLayer) map.removeLayer(windOverlayLayer);
      windOverlayLayer = L.layerGroup();

      const bounds = map.getBounds();
      // 40px minimum spacing — fingertip-width on a plotter screen, distinguishable with gloves.
      const MIN_PX = 40;
      const keptPx = [];

      for (const { lat, lon, u, v } of allWindPoints) {
        if (!bounds.contains([lat, lon])) continue;

        const spd = Math.sqrt(u * u + v * v) * 1.94384; // m/s → knots
        if (spd < 0.5) continue;

        const px = map.latLngToContainerPoint([lat, lon]);
        let tooClose = false;
        for (const p of keptPx) {
          const dx = p.x - px.x, dy = p.y - px.y;
          if (dx * dx + dy * dy < MIN_PX * MIN_PX) { tooClose = true; break; }
        }
        if (tooClose) continue;

        keptPx.push(px);
        const dir = (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360;
        L.marker([lat, lon], {
          icon: L.divIcon({
            html: `<div style="opacity:0.85;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,0.9))">${windBarbSvg(spd, dir, '#ffffff')}</div>`,
            iconSize: [30, 36], iconAnchor: [0, 22], className: '',
          }),
          pane: 'windOverlayPane',
        }).addTo(windOverlayLayer);
      }
      windOverlayLayer.addTo(map);
    }

    async function initWindScrubber() {
      const r = await apiFetch(`${API}/wind-times`);
      if (!r.ok) return;
      const { times } = await r.json();
      windTimes = times;
      const scrubber = document.getElementById('time-scrubber');
      scrubber.min = 0;
      scrubber.max = times.length - 1;
      scrubber.value = 0;
      document.getElementById('time-scrubber-panel').style.display = 'flex';
      windTimesLoaded = true;
      await fetchWindPoints(0);
    }

    async function fetchAndDrawRoute() {
      try {
        const r = await apiFetch(`${API}/pending-route`);
        if (!r.ok) { setStatus('error', `Could not fetch route (HTTP ${r.status})`); return; }
        const route = await r.json();
        const coords = route.feature?.geometry?.coordinates;
        if (!coords) { setStatus('error', 'Route has no coordinates'); return; }

        if (routeLayer) map.removeLayer(routeLayer);
        if (windBarbLayer) map.removeLayer(windBarbLayer);

        routeLayer = L.polyline(coords.map(([lng, lat]) => [lat, lng]), {
          color: '#89b4fa', weight: 3, opacity: 0.9,
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

        const meta = route.feature?.properties?.coordinatesMeta ?? [];
        windBarbLayer = L.layerGroup();
        coords.forEach(([lng, lat], i) => {
          const m = meta[i];
          if (!m) return;
          const eta = new Date(m.time).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const html =
            `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none">` +
            windBarbSvg(m.tws ?? 0, m.windDir ?? 0) +
            `<div style="color:#cdd6f4;background:#313244cc;font-size:10px;padding:1px 4px;border-radius:3px;white-space:nowrap">${eta}</div>` +
            `</div>`;
          L.marker([lat, lng], {
            icon: L.divIcon({ html, iconSize: [30, 54], iconAnchor: [15, 33], className: '' }),
            pane: 'windBarbPane',
          }).bindTooltip(`${(m.tws ?? 0).toFixed(1)} kn, ${m.windDir ?? 0}° — boat ${(m.boatSpeed ?? 0).toFixed(1)} kn`, { direction: 'top', offset: [0, -10] })
            .addTo(windBarbLayer);
        });
        windBarbLayer.addTo(map);

        if (legLabelLayer) map.removeLayer(legLabelLayer);
        legLabelLayer = L.layerGroup();
        for (let i = 0; i < coords.length - 1; i++) {
          const m1 = meta[i], m2 = meta[i + 1];
          if (!m1 || !m2) continue;
          const midLat = (coords[i][1] + coords[i + 1][1]) / 2;
          const midLng = (coords[i][0] + coords[i + 1][0]) / 2;
          const avgTws = ((m1.tws ?? 0) + (m2.tws ?? 0)) / 2;
          const avgBoatSpeed = ((m1.boatSpeed ?? 0) + (m2.boatSpeed ?? 0)) / 2;
          // Circular mean for wind direction (handles 359°/1° wrap)
          const a1 = (m1.windDir ?? 0) * Math.PI / 180;
          const a2 = (m2.windDir ?? 0) * Math.PI / 180;
          const avgDir = Math.atan2((Math.sin(a1) + Math.sin(a2)) / 2, (Math.cos(a1) + Math.cos(a2)) / 2) * 180 / Math.PI;
          const html = `<div style="display:flex;flex-direction:column;align-items:center;pointer-events:none">` +
                       windBarbSvg(avgTws, (avgDir + 360) % 360) +
                       `</div>`;
          L.marker([midLat, midLng], {
            icon: L.divIcon({ html, iconSize: [30, 48], iconAnchor: [15, 28], className: '' }),
            pane: 'windBarbPane',
          }).bindTooltip(`${avgTws.toFixed(1)} kn, ${Math.round((avgDir + 360) % 360)}° — boat ${avgBoatSpeed.toFixed(1)} kn`, { direction: 'top', offset: [0, -10] })
            .addTo(legLabelLayer);
        }
        legLabelLayer.addTo(map);
        drawConditionsGraph(meta);

        if (windTimesLoaded && meta.length > 0) {
          const t0ms = new Date(meta[0].time).getTime();
          const tNms = new Date(meta[meta.length - 1].time).getTime();
          let i0 = windTimes.findIndex(t => new Date(t).getTime() >= t0ms);
          let iN = windTimes.findIndex(t => new Date(t).getTime() >= tNms);
          if (i0 < 0) i0 = 0;
          if (iN < 0) iN = windTimes.length - 1;
          const scrubber = document.getElementById('time-scrubber');
          scrubber.min = i0;
          scrubber.max = iN;
          scrubber.value = i0;
          fetchWindPoints(i0);
        }
      } catch(e) { setStatus('error', `Draw failed: ${e}`); }
    }

    // --- Conditions graph ---

    let conditionsExpanded = true;
    let conditionsFullscreen = false;

    function enterConditionsFullscreen() {
      conditionsFullscreen = true;
      const panel = document.getElementById('conditions-panel');
      panel.classList.add('conditions-fullscreen');
      panel.style.height = '';
    }

    function exitConditionsFullscreen() {
      conditionsFullscreen = false;
      const panel = document.getElementById('conditions-panel');
      panel.classList.remove('conditions-fullscreen');
      panel.style.height = conditionsExpanded ? '210px' : '24px';
    }

    document.getElementById('conditions-handle').addEventListener('click', () => {
      if (conditionsFullscreen) { exitConditionsFullscreen(); return; }
      conditionsExpanded = !conditionsExpanded;
      document.getElementById('conditions-svg').style.display = conditionsExpanded ? '' : 'none';
      document.getElementById('conditions-toggle').textContent = conditionsExpanded ? '▼' : '▶';
      document.getElementById('conditions-panel').style.height = conditionsExpanded ? '210px' : '24px';
    });

    document.getElementById('conditions-svg').addEventListener('click', () => {
      if (conditionsFullscreen) exitConditionsFullscreen();
      else enterConditionsFullscreen();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && conditionsFullscreen) exitConditionsFullscreen();
    });

    function drawConditionsGraph(meta) {
      const panel = document.getElementById('conditions-panel');
      if (!meta || meta.length < 2) { panel.style.display = 'none'; return; }

      const hasWave = meta.some(m => m.waveHeight != null);

      // ViewBox layout — VH=184 to accommodate the 12px GRIB source stripe below wind arrows
      const VW = 800, VH = 184;
      const ml = 50, mr = hasWave ? 52 : 12, mt = 18, mb = 76;
      const pw = VW - ml - mr, ph = VH - mt - mb;

      graphMeta = meta;

      const maxTws = Math.ceil(Math.max(...meta.map(m => m.tws ?? 0)) / 5) * 5 || 5;
      const maxBoatSpeed = Math.ceil(Math.max(...meta.map(m => m.boatSpeed ?? 0)) / 5) * 5 || 5;
      const maxLeft = Math.max(maxTws, maxBoatSpeed);
      const rawMaxWave = hasWave ? Math.max(...meta.map(m => m.waveHeight ?? 0)) : 0;
      const maxWave = hasWave ? Math.max(1, Math.ceil(rawMaxWave * 2) / 2) : 0;

      const hasGrib = meta.some(m => m.gribFile != null);
      graphLayout = { VW, ml, pw, mt, ph, hasWave, hasGrib, maxLeft, maxBoatSpeed, maxWave };

      const xOf = i => (ml + (i / (meta.length - 1)) * pw).toFixed(1);
      const yLeft = v => (mt + ph * (1 - v / maxLeft)).toFixed(1);
      const yWave = v => (mt + ph * (1 - v / maxWave)).toFixed(1);

      const el = [];

      el.push(`<defs><marker id="wdarrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
        <polygon points="0,0 5,2.5 0,5" fill="#a6adc8"/>
      </marker></defs>`);

      // Horizontal grid + left y-axis (wind speed and boat speed, both in kn)
      const twsStep = maxLeft <= 15 ? 5 : 10;
      for (let v = 0; v <= maxLeft; v += twsStep) {
        const y = yLeft(v);
        el.push(`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="#313244" stroke-width="0.5"/>`);
        el.push(`<text x="${ml-4}" y="${parseFloat(y)+3.5}" text-anchor="end" fill="#89b4fa" font-size="10">${v}</text>`);
      }
      el.push(`<text x="${ml-4}" y="${mt-5}" text-anchor="end" fill="#89b4fa" font-size="9">kn</text>`);

      // Right y-axis (wave height)
      if (hasWave) {
        const wStep = maxWave <= 3 ? 0.5 : 1;
        for (let v = 0; v <= maxWave + 0.001; v += wStep) {
          const y = yWave(v);
          el.push(`<text x="${ml+pw+4}" y="${parseFloat(y)+3.5}" text-anchor="start" fill="#a6e3a1" font-size="10">${v % 1 === 0 ? v : v.toFixed(1)}</text>`);
        }
        el.push(`<text x="${ml+pw+4}" y="${mt-5}" text-anchor="start" fill="#a6e3a1" font-size="9">m</text>`);
        el.push(`<line x1="${ml+pw}" y1="${mt}" x2="${ml+pw}" y2="${mt+ph}" stroke="#45475a" stroke-width="1"/>`);
      }

      // Axis lines
      el.push(`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="#45475a" stroke-width="1"/>`);
      el.push(`<line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="#45475a" stroke-width="1"/>`);

      // Wind speed line
      el.push(`<path d="${meta.map((m,i) => (i===0?'M':'L')+xOf(i)+','+yLeft(m.tws??0)).join(' ')}" fill="none" stroke="#89b4fa" stroke-width="2" stroke-linejoin="round"/>`);

      // Boat speed line
      el.push(`<path d="${meta.map((m,i) => (i===0?'M':'L')+xOf(i)+','+yLeft(m.boatSpeed??0)).join(' ')}" fill="none" stroke="#fab387" stroke-width="2" stroke-linejoin="round"/>`);

      // Wave height line
      if (hasWave) {
        el.push(`<path d="${meta.map((m,i) => (i===0?'M':'L')+xOf(i)+','+yWave(m.waveHeight??0)).join(' ')}" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-linejoin="round"/>`);
      }

      // Per-waypoint: dots, labels, direction arrows
      const labelEvery = Math.max(1, Math.ceil(meta.length / 7));
      const arrowY = mt + ph + 44;

      for (let i = 0; i < meta.length; i++) {
        const m = meta[i];
        const x = parseFloat(xOf(i));
        const d = new Date(m.time);

        el.push(`<circle cx="${x}" cy="${yLeft(m.tws??0)}" r="3" fill="#89b4fa"/>`);
        el.push(`<circle cx="${x}" cy="${yLeft(m.boatSpeed??0)}" r="3" fill="#fab387"/>`);
        if (hasWave) {
          el.push(`<circle cx="${x}" cy="${yWave(m.waveHeight??0)}" r="3" fill="${m.waveHeight!=null?'#a6e3a1':'#313244'}"/>`);
        }

        // X-axis time label
        if (i === 0 || i === meta.length - 1 || i % labelEvery === 0) {
          const label = d.toLocaleDateString([],{month:'short',day:'numeric'}) + ' ' +
                        d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
          const ly = mt + ph + 13;
          el.push(`<text x="${x}" y="${ly}" text-anchor="middle" fill="#6c7086" font-size="9" transform="rotate(-40,${x},${ly})">${label}</text>`);
        }

        // Wind direction arrow — points toward where wind blows (windDir is FROM direction)
        const windDeg = ((m.windDir ?? 0) + 180) % 360;
        const rad = windDeg * Math.PI / 180;
        const len = 9;
        const dx = Math.sin(rad) * len, dy = -Math.cos(rad) * len;
        el.push(`<line x1="${(x - dx/2).toFixed(1)}" y1="${(arrowY - dy/2).toFixed(1)}" x2="${(x + dx/2).toFixed(1)}" y2="${(arrowY + dy/2).toFixed(1)}" stroke="#a6adc8" stroke-width="1.5" marker-end="url(#wdarrow)"/>`);
      }

      // Legend
      el.push(`<rect x="${ml}" y="3" width="10" height="10" fill="#89b4fa" rx="1"/>`);
      el.push(`<text x="${ml+13}" y="12" fill="#89b4fa" font-size="10">Wind speed</text>`);
      el.push(`<rect x="${ml+90}" y="3" width="10" height="10" fill="#fab387" rx="1"/>`);
      el.push(`<text x="${ml+103}" y="12" fill="#fab387" font-size="10">Boat speed</text>`);
      if (hasWave) {
        el.push(`<rect x="${ml+185}" y="3" width="10" height="10" fill="#a6e3a1" rx="1"/>`);
        el.push(`<text x="${ml+198}" y="12" fill="#a6e3a1" font-size="10">Wave height</text>`);
      }

      // GRIB source stripe — colored segments below wind arrows, one per waypoint
      if (hasGrib) {
        const stripeTop = mt + ph + 62;  // y=170, below wind arrows at y=152
        const stripeH = 12;
        for (let i = 0; i < meta.length; i++) {
          const x1 = parseFloat(xOf(i));
          const x2 = i < meta.length - 1 ? parseFloat(xOf(i + 1)) : ml + pw;
          const filePath = meta[i].gribFile;
          const colorIdx = filePath != null ? gribInfoFiles.findIndex(f => f.path === filePath) : -1;
          const color = colorIdx >= 0 ? C64_PALETTE[colorIdx % C64_PALETTE.length] : '#45475a';
          el.push(`<rect x="${x1.toFixed(1)}" y="${stripeTop}" width="${(x2 - x1).toFixed(1)}" height="${stripeH}" fill="${color}" opacity="0.7"/>`);
        }
        el.push(`<text x="${ml-4}" y="${mt + ph + 71}" text-anchor="end" fill="#6c7086" font-size="9">GRIB</text>`);
      }

      const svgEl = document.getElementById('conditions-svg');
      svgEl.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
      svgEl.innerHTML = el.join('\n');

      if (!conditionsFullscreen) panel.style.height = conditionsExpanded ? '210px' : '24px';
      panel.style.display = 'flex';
    }

    function activatePlacing(which) {
      placing = which;
      btnStart.classList.toggle('active', which === 'start');
      btnEnd.classList.toggle('active', which === 'end');
      map.getContainer().style.cursor = 'crosshair';
    }

    function updateCalcButton() {
      calcBtn.disabled = !(startLatLon && endLatLon && gribLoaded && gribWarningAcked);
    }

    function setTestRoute(s, e, departureValue) {
      startLatLon = s;
      endLatLon   = e;
      startCoords.textContent = `${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}`;
      endCoords.textContent   = `${e.lat.toFixed(4)}, ${e.lon.toFixed(4)}`;
      startMarker.setLatLng([s.lat, s.lon]).addTo(map);
      endMarker.setLatLng([e.lat, e.lon]).addTo(map);
      document.getElementById('departure-time').value = departureValue;
      updateCalcButton();
      startCalculation();
    }

    const OREGRUND = { lat: 60.3996, lon: 18.3403 };

    function runTest() {
      setTestRoute(OREGRUND, { lat: 58.5052, lon: 17.3474 }, '2026-05-24T08:00');
    }

    function runHelsinkiTest() {
      setTestRoute(OREGRUND, { lat: 60.0902, lon: 24.9472 }, '2026-06-06T02:00');
    }

    function runGothenburgTest() {
      setTestRoute(OREGRUND, { lat: 57.6138, lon: 11.5980 }, '2026-06-06T02:00');
    }

    function setStatus(type, msg) {
      statusBox.className = type === 'error' || type === 'done' ? type : '';
      statusBox.textContent = msg;
    }

    function showFailurePopup(msg, isWarning) {
      const popup = document.getElementById('failure-popup');
      popup.className = isWarning ? 'warning' : 'error';
      document.getElementById('failure-popup-msg').textContent = msg;
      popup.style.display = 'flex';
    }

    function hideFailurePopup() {
      document.getElementById('failure-popup').style.display = 'none';
    }

    document.getElementById('failure-popup-close').addEventListener('click', hideFailurePopup);

    function toLocalDateTimeInput(d) {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function greenIcon() {
      return L.divIcon({ html: '<div style="background:#a6e3a1;width:12px;height:12px;border-radius:50%;border:2px solid #1e2230"></div>', iconSize:[12,12], iconAnchor:[6,6] });
    }
    function redIcon() {
      return L.divIcon({ html: '<div style="background:#f38ba8;width:12px;height:12px;border-radius:50%;border:2px solid #1e2230"></div>', iconSize:[12,12], iconAnchor:[6,6] });
    }

    async function renderLandOverlay() {
      if (!gribLoaded) return;
      const token = ++renderLandOverlayToken;

      if (landLayerOrig)    { map.removeLayer(landLayerOrig);    landLayerOrig    = null; }
      if (landLayerDilated) { map.removeLayer(landLayerDilated); landLayerDilated = null; }

      if (!document.getElementById('land-toggle').checked) return;

      const b = map.getBounds();
      const bboxQuery = `latMin=${b.getSouth()}&lonMin=${b.getWest()}&latMax=${b.getNorth()}&lonMax=${b.getEast()}`;
      const safetyOn = dilatedIndexReady && document.getElementById('safety-margin-toggle').checked;

      const r = await apiFetch(`${API}/land-polygons?${bboxQuery}`);
      if (!r.ok) return;
      if (token !== renderLandOverlayToken || !document.getElementById('land-toggle').checked) return;
      const data = await r.json();
      if (token !== renderLandOverlayToken || !document.getElementById('land-toggle').checked) return;

      landLayerOrig = L.geoJSON(data, {
        style: { color: '#6c7086', weight: 0.5, fillColor: '#45475a', fillOpacity: 0.6, pane: 'landPane' },
        renderer: L.canvas({ pane: 'landPane' }),
      }).addTo(map);

      if (safetyOn) {
        const r2 = await apiFetch(`${API}/land-polygons?dilated=true&${bboxQuery}`);
        if (!r2.ok) return;
        if (token !== renderLandOverlayToken || !document.getElementById('land-toggle').checked) return;
        const data2 = await r2.json();
        if (token !== renderLandOverlayToken || !document.getElementById('land-toggle').checked) return;

        landLayerDilated = L.geoJSON(data2, {
          style: { color: '#9399b2', weight: 0.5, fillColor: '#585b70', fillOpacity: 0.4, pane: 'landDilatedPane' },
          renderer: L.canvas({ pane: 'landDilatedPane' }),
        }).addTo(map);
      }
    }

    document.getElementById('land-toggle').addEventListener('change', async (e) => {
      if (e.target.checked) {
        await renderLandOverlay();
      } else {
        renderLandOverlayToken++;
        if (landLayerOrig)    { map.removeLayer(landLayerOrig);    landLayerOrig    = null; }
        if (landLayerDilated) { map.removeLayer(landLayerDilated); landLayerDilated = null; }
      }
    });

    map.on('moveend', () => {
      if (document.getElementById('land-toggle').checked) renderLandOverlay();
    });

    map.on('zoomend moveend', () => {
      if (allWindPoints.length > 0 && document.getElementById('wind-overlay-toggle').checked) renderWindOverlay();
    });

    document.getElementById('wind-overlay-toggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        if (allWindPoints.length > 0) renderWindOverlay();
      } else {
        if (windOverlayLayer) { map.removeLayer(windOverlayLayer); windOverlayLayer = null; }
      }
    });

    document.getElementById('safety-margin-toggle').addEventListener('change', () => {
      if (document.getElementById('land-toggle').checked) {
        renderLandOverlay();
      }
    });

    const saveRouteBtn   = document.getElementById('save-route-btn');
    const saveModalOverlay = document.getElementById('save-modal-overlay');
    const routeNameInput = document.getElementById('route-name-input');
    const modalSaveBtn   = document.getElementById('modal-save-btn');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');

    saveRouteBtn.addEventListener('click', () => {
      const defaultName = `Weather Route ${new Date().toLocaleString()}`;
      routeNameInput.value = defaultName;
      saveModalOverlay.classList.add('visible');
      routeNameInput.select();
    });

    modalCancelBtn.addEventListener('click', () => {
      saveModalOverlay.classList.remove('visible');
    });

    modalSaveBtn.addEventListener('click', async () => {
      const name = routeNameInput.value.trim() || `Weather Route ${new Date().toLocaleString()}`;
      modalSaveBtn.disabled = true;
      try {
        const r = await apiFetch(`${API}/save-route`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const j = await r.json();
        if (j.error) {
          setStatus('error', `Save failed: ${j.error}`);
        } else {
          setStatus('done', `Route saved: ${name}`);
        }
      } catch(e) {
        setStatus('error', `Save failed: ${e}`);
      } finally {
        modalSaveBtn.disabled = false;
        saveModalOverlay.classList.remove('visible');
      }
    });

    async function checkDilatedReady() {
      try {
        const r = await apiFetch(`${API}/status`);
        const j = await r.json();
        if (j.dilatedIndexReady) {
          dilatedIndexReady = true;
          document.getElementById('safety-margin-building').style.display = 'none';
          document.getElementById('safety-margin-wrap').style.display = '';
          if (dilatedPollTimer) { clearInterval(dilatedPollTimer); dilatedPollTimer = null; }
        } else {
          document.getElementById('safety-margin-building').style.display = 'block';
          document.getElementById('safety-margin-pct').textContent = j.dilatedBuildProgress ?? 0;
        }
      } catch { /* ignore — server may still be starting */ }
    }

    checkDilatedReady();
    dilatedPollTimer = setInterval(checkDilatedReady, 3000);

    const svgEl = document.getElementById('conditions-svg');
    const tooltip = document.getElementById('graph-tooltip');

    svgEl.addEventListener('mousemove', (e) => {
      if (!graphMeta || !graphLayout) return;
      const { VW, ml, pw, mt, ph, hasWave, maxLeft, maxBoatSpeed, maxWave } = graphLayout;
      const rect = svgEl.getBoundingClientRect();
      const svgX = (e.clientX - rect.left) / rect.width * VW;
      const frac = (svgX - ml) / pw;
      const idx = Math.max(0, Math.min(graphMeta.length - 1, Math.round(frac * (graphMeta.length - 1))));
      const m = graphMeta[idx];
      const d = new Date(m.time);
      const dateStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
                      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let html = `<strong>${dateStr}</strong><br>Wind: ${(m.tws ?? 0).toFixed(1)} kn from ${m.windDir ?? 0}°`;
      if (m.boatSpeed != null) html += `<br>Boat: ${m.boatSpeed.toFixed(1)} kn`;
      if (m.waveHeight != null) html += `<br>Wave: ${m.waveHeight.toFixed(1)} m`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
      const ttW = tooltip.offsetWidth, ttH = tooltip.offsetHeight;
      let left = e.clientX + 12, top = e.clientY - ttH / 2;
      if (left + ttW > window.innerWidth - 8) left = e.clientX - ttW - 12;
      if (top < 8) top = 8;
      if (top + ttH > window.innerHeight - 8) top = window.innerHeight - ttH - 8;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    });

    svgEl.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  </script>
</body>
</html>
